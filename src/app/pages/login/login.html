<div class="caja">
    <h3>Iniciar sesion</h3>

    <form (ngSubmit)="login()">
        <label for="">Correo</label>
        <input type="text" class="form-control mb-2" name="email" [(ngModel)]="email">

        <label for="">Contraseña</label>
        <input type="password" class="form-control mb-3" name="password" [(ngModel)]="password">

        <button type="submit" class="btn btn-dark w-100">Entrar</button>
    </form>

    <p class="mensaje">{{ mensaje() }}</p>
    <a routerLink="/registro">no tienes cuenta? registrate</a>
</div>
