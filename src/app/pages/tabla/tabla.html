<h3>Catalogo de libros</h3>

<label for="">Filtrar por genero: </label>
<select class="form-select w-auto d-inline-block mb-3" [(ngModel)]="genero">
    <option value="">Todos</option>
    <option value="novela">Novela</option>
    <option value="fantasia">Fantasia</option>
    <option value="historia">Historia</option>
    <option value="poesia">Poesia</option>
</select>

<table class="table table-bordered table-hover bg-white">
    <thead>
        <tr>
            <th>TITULO</th>
            <th>AUTOR</th>
            <th>GENERO</th>
            <th>PRECIO</th>
        </tr>
    </thead>
    <tbody>
        @for (libro of libros(); track libro.id) {
        @if (genero == "" || genero == libro.genero) {
            <tr>
                <td>{{ libro.titulo }}</td>
                <td>{{ libro.autor }}</td>
                <td>{{ libro.genero }}</td>
                <td>{{ libro.precio | currency }}</td>
            </tr>
        }
        }
    </tbody>
</table>
